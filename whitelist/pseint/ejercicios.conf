pista2=Una receta: ingredientes (entrada), coccion (proceso), plato (salida).
pista3=Las palabras son: entrada, proceso y salida.
criterio=Menciona entrada
criterio=Menciona proceso
criterio=Menciona salida
validacion=exacta
curso=FPY1101
ea=EA1
actividad=4

