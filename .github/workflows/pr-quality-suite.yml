name: PR Quality - Suite

on:
  pull_request:
    branches: [main, lowmem, ultra-lowmem]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: style
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Check code style (ruff format --check)
        run: ruff format --check *.py yap/ tests/

      - name: Lint (ruff check)
        run: ruff check *.py yap/ tests/

  static:
    name: static
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install pyflakes
        run: pip install pyflakes==3.2.0

      - name: Static analysis (pyflakes)
        run: pyflakes *.py yap/ tests/

      - name: HD-YAP-SEC-001 static checks
        run: |
          set -e
          FAIL=0
          # Codigo del agente: los .py de la raiz y el paquete yap/ (#267).
          # Desde #254 yap.py es un shim; mirar solo ese fichero no ve nada.
          FUENTES=$(ls *.py; find yap -name '*.py')
          for pattern in "shell=True" "eval(" "os.system(" "import socket" "import ctypes" "import pickle" "import base64"; do
            if grep -nF "$pattern" $FUENTES 2>/dev/null | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' | grep -q .; then
              echo "FAIL: found '$pattern' (not in a comment)"
              grep -nF "$pattern" $FUENTES | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::HD-YAP-SEC-001 violated: prohibited patterns found"
            exit 1
          fi
          echo "PASS: no prohibited patterns in: $(echo $FUENTES)"

  arch:
    name: arch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Architecture validation (imports + structure)
        run: |
          set -e
          # Todo el codigo del agente parsea: raiz y paquete yap/ (#267)
          python3 -c "
          import ast, glob
          for f in sorted(glob.glob('*.py') + glob.glob('yap/**/*.py', recursive=True)):
              ast.parse(open(f).read())
              print(f'PASS: {f} parses cleanly')
          "

          # Verify no circular imports in test files
          python3 -c "
          import ast, glob, sys
          for f in sorted(glob.glob('*.py') + glob.glob('yap/**/*.py', recursive=True)):
              tree = ast.parse(open(f).read())
              imports = [n for n in ast.walk(tree) if isinstance(n, (ast.Import, ast.ImportFrom))]
              print(f'{f}: {len(imports)} imports OK')
          "

          # Verify whitelists exist and are non-empty
          for wl in whitelist/apps.conf whitelist/web.conf; do
            if [ ! -s "$wl" ]; then
              echo "::error::whitelist $wl is missing or empty"
              exit 1
            fi
            echo "PASS: $wl exists and non-empty"
          done

  tests_cov:
    name: tests_cov
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest==8.3.3 pytest-cov==5.0.0

      - name: Tests with coverage
        run: |
          python3 -m pytest tests/ -v \
            --cov=yap \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-branch \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  deps:
    name: deps
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Dependency audit (pip-audit)
        run: |
          # Yap has no requirements.txt (stdlib only), but check if one appears
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --strict
          else
            echo "No requirements.txt — Yap uses stdlib only. Scanning installed packages."
            pip-audit --strict || echo "WARN: pip-audit found issues in environment (non-blocking for stdlib project)"
          fi

      - name: Verify no new dependencies introduced
        run: |
          # Yap is stdlib-only by design (CLAUDE.md §3). Flag any new import
          # that is not in the stdlib or the existing whitelist.
          python3 -c "
          import ast, sys, os
          STDLIB = set(sys.stdlib_module_names)
          # Modulos de primer nivel del propio repo: no son dependencias.
          # Se derivan de los .py de la raiz, no se declaran: una lista
          # a mano se desincroniza entre ramas — fallo yo al abrir el
          # #254 declarando yap_core, que vive en el #253 y aun no existe
          # aqui. Un .py en la raiz es de primer nivel por definicion.
          FIRST_PARTY = {
              f[:-3] for f in os.listdir('.')
              if f.endswith('.py') and os.path.isfile(f)
          }
          # Todo el codigo del agente, no solo el shim yap.py (#267)
          import glob
          FUENTES = sorted(glob.glob('*.py') + glob.glob('yap/**/*.py', recursive=True))
          non_stdlib = set()
          for node in (n for f in FUENTES for n in ast.walk(ast.parse(open(f).read()))):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      root = alias.name.split('.')[0]
                      if root not in STDLIB and root not in FIRST_PARTY:
                          non_stdlib.add(root)
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      root = node.module.split('.')[0]
                      if root not in STDLIB and root not in FIRST_PARTY:
                          non_stdlib.add(root)
          if non_stdlib:
              print(f'::error::Non-stdlib imports detected: {non_stdlib}')
              print('Yap must be stdlib-only per CLAUDE.md §3')
              sys.exit(1)
          print(f'PASS: {len(FUENTES)} files use only stdlib and first-party modules')
          "

  quality-summary:
    name: Quality Summary
    needs: [style, static, arch, tests_cov, deps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize quality gates
        run: |
          gate_ok() {
            case "$1" in
              success|skipped) return 0 ;;
              *) return 1 ;;
            esac
          }

          echo "### PR Quality Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| style (ruff) | ${{ needs.style.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| static (pyflakes + SEC-001) | ${{ needs.static.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| arch (structure) | ${{ needs.arch.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tests_cov (pytest + coverage) | ${{ needs.tests_cov.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| deps (pip-audit + stdlib check) | ${{ needs.deps.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if ! gate_ok "${{ needs.style.result }}" || \
             ! gate_ok "${{ needs.static.result }}" || \
             ! gate_ok "${{ needs.arch.result }}" || \
             ! gate_ok "${{ needs.tests_cov.result }}" || \
             ! gate_ok "${{ needs.deps.result }}"; then
            echo "**Result:** FAILED - One or more PR quality checks did not pass" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "**Result:** PASSED - All PR quality checks passed" >> "$GITHUB_STEP_SUMMARY"
