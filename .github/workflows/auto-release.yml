# Release de Yap — cadencia MANUAL (A-Dev regla 14, GOVERNANCE.md)
#
# Este workflow NO se dispara al mergear. Regla 14 de A-Dev:
#   "Versioning and tagging happen on a manual initiative cadence; do not
#    assume a tag or public release for every PR or minor change."
#
# El flujo es de una persona, en este orden:
#
#   1. Actualiza CHANGELOG.md (mueve lo de [Unreleased] a [X.Y.Z] - fecha)
#      y VERSION en una PR normal. La revisa, la mergea.
#   2. Taggea a mano desde main:
#        git tag vX.Y.Z && git push origin vX.Y.Z
#      o bien lanza este workflow desde la pestaña "Actions" con la versión.
#   3. Este workflow publica el release de GitHub con la sección del CHANGELOG.
#
# No abre PRs ni escribe en main: `main` está protegida (strict +
# enforce_admins) y un bot no debe saltársela.

name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, sin la v (ej. 1.1.0). Vacío = la de VERSION."
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Determinar versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Versión inválida: '$VERSION'"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publicando v$VERSION"

      - name: Extraer sección del CHANGELOG
        id: log
        run: |
          python3 - "$VERSION" >> "$GITHUB_OUTPUT" <<'PYEOF'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          ruta = Path("CHANGELOG.md")

          if not ruta.exists():
              print("cuerpo=")
              print("titulo=Release v" + version)
              sys.exit(0)

          contenido = ruta.read_text(encoding="utf-8")
          patron = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          encuentro = re.search(patron, contenido, re.DOTALL | re.MULTILINE)

          if encuentro:
              cuerpo = encuentro.group(1).strip()
          else:
              cuerpo = (
                  f"Sin entradas en CHANGELOG.md para v{version}.\n\n"
                  "Ver [CHANGELOG.md](https://github.com/ChincoLinux/Yap/blob/main/CHANGELOG.md)."
              )

          cuerpo = cuerpo or "Sin entradas registradas."
          # Los saltos de línea rompen el delimiter de GITHUB_OUTPUT.
          cuerpo = cuerpo.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"cuerpo={cuerpo}")
          PYEOF

      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: ${{ steps.log.outputs.cuerpo }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, 'beta') || contains(steps.ver.outputs.version, 'rc') || contains(steps.ver.outputs.version, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
