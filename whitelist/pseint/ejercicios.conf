# Yap ejercicios v2 (#27)
# Formato de bloque:
#   [id]
#   titulo=...
#   tipo=codigo_pseint | respuesta_libre | respuesta_texto | opcion_multiple | completar
#   enunciado=...
#   pista1=conceptual    pista2=parcial    pista3=casi solucion
#   criterio=...         (repetible; requerido si validacion=llm)
#   solucion=...         (repetible = lineas; oculto al estudiante)
#   opcion=...           (repetible; tipo=opcion_multiple)
#   respuesta_correcta=...
#   validacion=exacta | llm
#   curso=FPY1101  ea=EA1  actividad=1
#
# Compatibilidad v1 (una linea, no evaluable en 'yap ejercicios'):
#   Titulo:Descripcion|GuiaSolucion
#
# Claves repetidas solucion=/criterio=/opcion= se concatenan.

[hola_mundo]
titulo=Hola Mundo
tipo=codigo_pseint
enunciado=Escribe un algoritmo PSeInt que muestre "Hola, mundo" en pantalla.
solucion=Algoritmo HolaMundo
solucion=  Escribir "Hola, mundo"
solucion=FinAlgoritmo
pista1=Para mostrar texto en pantalla se usa la instruccion Escribir.
pista2=El programa debe abrir con Algoritmo y cerrar con FinAlgoritmo, y en el medio un Escribir con comillas.
pista3=Algoritmo HolaMundo / Escribir "Hola, mundo" / FinAlgoritmo
criterio=Usa Algoritmo y FinAlgoritmo
criterio=Usa Escribir
criterio=El texto contiene Hola, mundo
validacion=llm
curso=FPY1101
ea=EA1

[suma_dos_numeros]
titulo=Suma de dos numeros
tipo=codigo_pseint
enunciado=Escribe un algoritmo PSeInt que pida dos numeros al usuario y muestre su suma.
solucion=Algoritmo Suma
solucion=  Definir a, b, resultado Como Entero
solucion=  Escribir "Ingrese el primer numero:"
solucion=  Leer a
solucion=  Escribir "Ingrese el segundo numero:"
solucion=  Leer b
solucion=  resultado <- a + b
solucion=  Escribir "La suma es: ", resultado
solucion=FinAlgoritmo
pista1=Necesitas tres variables: dos para los numeros y una para el resultado.
pista2=Usa Leer para cada numero, luego resultado <- a + b, y Escribir para mostrar la suma.
pista3=Definir a, b, resultado Como Entero; Leer a y Leer b; resultado <- a + b; Escribir el resultado.
criterio=Usa Algoritmo y FinAlgoritmo
criterio=Declara variables con Definir
criterio=Lee las entradas con Leer
criterio=Calcula la suma y la muestra con Escribir
validacion=llm
curso=FPY1101
ea=EA1
actividad=2

[par_o_impar]
titulo=Par o Impar
tipo=codigo_pseint
enunciado=Pide un numero y determina si es par o impar.
solucion=Algoritmo ParOImpar
solucion=  Definir n Como Entero
solucion=  Escribir "Ingrese un numero:"
solucion=  Leer n
solucion=  Si n MOD 2 = 0 Entonces
solucion=    Escribir "Par"
solucion=  Sino
solucion=    Escribir "Impar"
solucion=  FinSi
solucion=FinAlgoritmo
pista1=Un numero es par cuando el resto de dividirlo por 2 es cero.
pista2=En PSeInt el resto se obtiene con MOD. Usa Si-Entonces-Sino para los dos casos.
pista3=Si n MOD 2 = 0 Entonces Escribir "Par" Sino Escribir "Impar" FinSi
criterio=Usa Si-Entonces-Sino
criterio=Usa MOD o equivalente para el resto
criterio=Lee el numero desde teclado
validacion=llm
curso=FPY1101
ea=EA1
actividad=3

[tabla_multiplicar]
titulo=Tabla de Multiplicar
tipo=codigo_pseint
enunciado=Pide un numero y muestra su tabla de multiplicar del 1 al 10.
solucion=Algoritmo TablaMultiplicar
solucion=  Definir n, i Como Entero
solucion=  Escribir "Ingrese un numero:"
solucion=  Leer n
solucion=  Para i <- 1 Hasta 10 Con Paso 1 Hacer
solucion=    Escribir n, " x ", i, " = ", n * i
solucion=  FinPara
solucion=FinAlgoritmo
pista1=Una tabla del 1 al 10 es un recuento fijo: encaja en un ciclo Para.
pista2=Declara n e i. Lee n y recorre i desde 1 hasta 10 mostrando n * i.
pista3=Para i <- 1 Hasta 10 Hacer Escribir n, " x ", i, " = ", n * i FinPara
criterio=Usa un ciclo Para o Mientras
criterio=Recorre del 1 al 10
criterio=Muestra el producto n * i
validacion=llm
curso=FPY1101
ea=EA1

[contador_regresivo]
titulo=Contador Regresivo
tipo=codigo_pseint
enunciado=Pide un numero N y muestra los numeros del N hasta 1.
solucion=Algoritmo ContadorRegresivo
solucion=  Definir n Como Entero
solucion=  Escribir "Ingrese N:"
solucion=  Leer n
solucion=  Mientras n >= 1 Hacer
solucion=    Escribir n
solucion=    n <- n - 1
solucion=  FinMientras
solucion=FinAlgoritmo
pista1=Hay que contar hacia atras: el ciclo se detiene al llegar a 1.
pista2=Puedes usar Mientras n >= 1, escribir n y restar 1 en cada vuelta.
pista3=Mientras n >= 1 Hacer Escribir n; n <- n - 1 FinMientras
criterio=Usa un ciclo (Mientras, Repetir o Para)
criterio=Cuenta hacia atras hasta 1
criterio=Lee N desde teclado
validacion=llm
curso=FPY1101
ea=EA1

[mayor_de_tres]
titulo=Mayor de Tres
tipo=codigo_pseint
enunciado=Pide tres numeros y muestra cual es el mayor.
solucion=Algoritmo MayorDeTres
solucion=  Definir a, b, c, mayor Como Entero
solucion=  Escribir "Ingrese tres numeros:"
solucion=  Leer a, b, c
solucion=  mayor <- a
solucion=  Si b > mayor Entonces
solucion=    mayor <- b
solucion=  FinSi
solucion=  Si c > mayor Entonces
solucion=    mayor <- c
solucion=  FinSi
solucion=  Escribir "El mayor es: ", mayor
solucion=FinAlgoritmo
pista1=Compara de a pares: guarda el mayor visto hasta ahora en una variable.
pista2=Inicializa mayor con el primer numero y actualizalo si b o c son mas grandes.
pista3=mayor <- a; Si b > mayor Entonces mayor <- b; Si c > mayor Entonces mayor <- c
criterio=Lee tres numeros
criterio=Usa condicionales para comparar
criterio=Muestra el mayor
validacion=llm
curso=FPY1101
ea=EA1

[partes_algoritmo]
