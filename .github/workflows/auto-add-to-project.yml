name: Auto-add to Roadmap Project

on:
  issues:
    types:
      - opened
      - reopened
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: read
  projects: write
  issues: read
  pull-requests: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/ChincoLinux/projects/3
          github-token: ${{ secrets.PROJECT_PAT }}
