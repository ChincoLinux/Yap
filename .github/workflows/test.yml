# Yap — CI/CD Pipeline
#
# Se ejecuta en cada push y PR a las ramas: main, lowmem, ultra-lowmem
# Etapas:
#   1. test-unit: 49 pruebas unitarias (seguridad + funcional) con pytest
#   2. test-report: Verificacion estatica del codigo fuente
#   3. test-config: Validacion de archivos de configuracion

name: Yap CI

on:
  push:
    branches: [main, lowmem, ultra-lowmem]
  pull_request:
    branches: [main, lowmem, ultra-lowmem]

jobs:

  # ──────────────────────────────────────────────────────────────────
  # JOB 1: Pruebas unitarias (seguridad + funcional)
  # ──────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Unit tests (49) - Python 3.12"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Ejecutar pruebas de seguridad
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  PRUEBAS DE SEGURIDAD (25)"
          echo "═══════════════════════════════════════════════"
          python -m pytest tests/test_yap_security.py -v --tb=short

      - name: Ejecutar pruebas funcionales
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  PRUEBAS FUNCIONALES (24)"
          echo "═══════════════════════════════════════════════"
          python -m pytest tests/test_yap_functional.py -v --tb=short

      - name: Ejecutar pruebas de evaluacion automatica
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  PRUEBAS DE EVALUACION (#23)"
          echo "═══════════════════════════════════════════════"
          python -m pytest tests/test_yap_evaluacion.py -v --tb=short

      - name: Verificar ausencia de vulnerabilidades
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  VERIFICACION ESTATICA DE CODIGO"
          echo "═══════════════════════════════════════════════"
          # Verificar que no hay shell=True, eval(), os.system()
          ! grep -rn "shell=True" yap.py && echo "✓ sin shell=True"
          ! grep -rn "eval(" yap.py && echo "✓ sin eval()"
          ! grep -rn "os\.system(" yap.py && echo "✓ sin os.system()"

      - name: Verificar archivos de configuracion
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  VALIDACION DE CONFIGURACION"
          echo "═══════════════════════════════════════════════"
          test -f whitelist/apps.conf && echo "✓ whitelist/apps.conf existe"
          test -f whitelist/web.conf && echo "✓ whitelist/web.conf existe"
          grep -qE '^[^#].+:.+$' whitelist/apps.conf && echo "✓ apps.conf con entradas validas"
          grep -qE '^[^#].+\.' whitelist/web.conf && echo "✓ web.conf con dominios validos"

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: Verificacion de ramas (modelos)
  # ──────────────────────────────────────────────────────────────────
  branch-check:
    name: "Validacion de ramas"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar MODEL_PATH en cada rama
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  VALIDACION DE MODELOS POR RAMA"
          echo "═══════════════════════════════════════════════"
          for branch in main lowmem ultra-lowmem; do
            if git show-ref --verify refs/heads/$branch 2>/dev/null || \
               git show-ref --verify refs/remotes/origin/$branch 2>/dev/null; then
              model=$(git show $branch:yap.py 2>/dev/null | grep 'MODEL_PATH =' | sed "s|.*/||;s|\"||g")
              echo "  $branch → $model"
            fi
          done

  # ──────────────────────────────────────────────────────────────────
  # JOB 3: Notificacion de resultados
  # ──────────────────────────────────────────────────────────────────
  results:
    name: "Resultados"
    if: always()
    needs: [unit-tests, branch-check]
    runs-on: ubuntu-latest

    steps:
      - name: Resumen de ejecucion
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  YAP — Resultados del pipeline"
          echo "  Ref: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "  Jobs:"
          echo "    • unit-tests:  ${{ needs.unit-tests.result }}"
          echo "    • branch-check: ${{ needs.branch-check.result }}"
          echo ""
          if [ "${{ needs.unit-tests.result }}" = "success" ]; then
            echo "  ✓ 49 pruebas pasadas — sistema seguro y funcional"
          else
            echo "  ✗ Pruebas fallidas — revisar logs"
          fi
