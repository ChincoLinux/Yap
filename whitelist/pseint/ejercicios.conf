# Ejercicios PSeInt — Introduccion a la programacion
# Formato: Titulo:Descripcion|GuiaSolucion (pasos separados por ;)
#
Hola Mundo:Escribe un programa que muestre "Hola, mundo" en pantalla.|Paso 1: Haz clic en el boton Nuevo (icono de hoja en blanco) o presiona Ctrl+N. Aparecera un lienzo vacio.; Paso 2: En la primera linea del lienzo, escribe exactamente: Algoritmo HolaMundo (sin tilde en Mundo, todo junto). Presiona Enter.; Paso 3: En la siguiente linea escribe exactamente: Escribir "Hola, mundo" — incluye las comillas dobles y el punto y coma al final. Presiona Enter.; Paso 4: En la linea siguiente escribe exactamente: FinAlgoritmo — sin punto ni nada mas. Presiona Enter.; Paso 5: Haz clic en el boton verde con triangulo (Ejecutar) en la barra superior, o presiona la tecla F9. Se abrira una ventana mostrando "Hola, mundo".; Paso 6: Para guardar, haz clic en Archivo > Guardar como, escribe "hola_mundo" como nombre y haz clic en Guardar. La extension .psc se agrega sola.
Suma de dos numeros:Pide dos numeros al usuario y muestra su suma.|Paso 1: Haz clic en Nuevo (Ctrl+N) para crear un algoritmo en blanco.; Paso 2: Escribe en la primera linea: Algoritmo Suma. Presiona Enter y escribe en la ultima linea: FinAlgoritmo .; Paso 3: Entre Algoritmo y FinAlgoritmo, escribe en una nueva linea: Definir a,b,resultado Como Entero — esto crea tres variables para guardar numeros enteros. La coma separa las variables. Presiona Enter.; Paso 4: En la siguiente linea escribe: Escribir "Ingrese el primer numero:" — esto mostrara un mensaje al usuario. En la linea siguiente escribe: Leer a — esto pausa el programa y espera que el usuario escriba un numero. Repite para b: Escribir "Ingrese el segundo numero:" y debajo Leer b .; Paso 5: En una nueva linea escribe: resultado = a + b — el signo = asigna el valor de la suma a la variable resultado. No uses espacios alrededor del = .; Paso 6: En la siguiente linea escribe: Escribir "La suma es: ", resultado — la coma dentro de Escribir concatena el texto con el valor de la variable resultado, mostrandolos juntos en pantalla.; Paso 7: Presiona F9 o haz clic en el boton verde Ejecutar. Cuando aparezca la ventana de entrada, escribe un numero (ej: 5) y presiona Enter, luego escribe otro (ej: 3) y presiona Enter. Debe mostrar "La suma es: 8".; Paso 8: Prueba con otros valores: vuelve a ejecutar (F9) e ingresa numeros negativos (-2 y 5) o cero (0 y 7). Verifica que el resultado sea correcto.
Par o Impar:Pide un numero y determina si es par o impar.
Tabla de Multiplicar:Pide un numero y muestra su tabla de multiplicar del 1 al 10.
Contador Regresivo:Pide un numero N y muestra los numeros del N hasta 1.
Mayor de Tres:Pide tres numeros y muestra cual es el mayor.
