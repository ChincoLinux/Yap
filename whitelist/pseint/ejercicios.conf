# Ejercicios PSeInt — Introduccion a la programacion
# Formato: Titulo:Descripcion|Guia de resolucion (pasos separados por ;)
#
# El docente puede agregar, modificar o eliminar ejercicios.
# Las lineas que comienzan con # son ignoradas.
#
Hola Mundo:Escribe un programa que muestre "Hola, mundo" en pantalla.|Paso 1: Crea Algoritmo HolaMundo...FinAlgoritmo; Paso 2: Define variables si las necesitas; Paso 3: Usa Escribir para mostrar texto; Paso 4: Ejecuta con F9 y verifica.
Suma de dos numeros:Pide dos numeros al usuario y muestra su suma.|Paso 1: Crea Algoritmo Suma con FinAlgoritmo; Paso 2: Define a,b,resultado Como Entero; Paso 3: Usa Escribir y Leer para pedir los dos numeros; Paso 4: Calcula resultado=a+b con asignacion; Paso 5: Muestra con Escribir "La suma es:",resultado; Paso 6: Ejecuta con F9 y prueba con diferentes valores.
Par o Impar:Pide un numero y determina si es par o impar.
Tabla de Multiplicar:Pide un numero y muestra su tabla de multiplicar del 1 al 10.
Contador Regresivo:Pide un numero N y muestra los numeros del N hasta 1.
Mayor de Tres:Pide tres numeros y muestra cual es el mayor.
