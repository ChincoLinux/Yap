# Ejercicios PSeInt - Introducción a la programación
# Formato: Título:Descripción|GuíaSolución (pasos separados por ;)
#
Hola Mundo:Escribe un programa que muestre "Hola, mundo" en pantalla.|Paso 1: Haz clic en el botón Nuevo (ícono de hoja en blanco) o presiona Ctrl+N. Aparecerá un lienzo vacío.; Paso 2: En la primera línea del lienzo, escribe exactamente: Algoritmo HolaMundo. La palabra HolaMundo no lleva tilde porque PSeInt no acepta acentos en nombres de algoritmos. Presiona Enter.; Paso 3: En la siguiente línea escribe exactamente: Escribir "Hola, mundo". Incluye las comillas dobles. No lleves punto y coma al final porque PSeInt no lo requiere. Presiona Enter.; Paso 4: En la línea siguiente escribe exactamente: FinAlgoritmo. No lleva punto ni nada más. Presiona Enter.; Paso 5: Haz clic en el botón verde con triángulo (Ejecutar) en la barra superior, o presiona la tecla F9. Se abrirá una ventana mostrando "Hola, mundo".; Paso 6: Para guardar, haz clic en Archivo, luego en Guardar como. Escribe "hola_mundo" como nombre y haz clic en Guardar. La extensión .psc se agrega automáticamente.
Suma de dos números:Pide dos números al usuario y muestra su suma.|Paso 1: Haz clic en Nuevo (Ctrl+N) para crear un algoritmo en blanco.; Paso 2: Escribe en la primera línea: Algoritmo Suma. Presiona Enter dos veces para dejar espacio, luego escribe: FinAlgoritmo.; Paso 3: Entre Algoritmo y FinAlgoritmo, escribe en una línea vacía: Definir a,b,resultado Como Entero. Esto crea tres variables para guardar números enteros. La coma entre a,b,resultado separa los nombres de las variables. Presiona Enter.; Paso 4: En la siguiente línea escribe: Escribir "Ingrese el primer número:". Esto mostrará un mensaje al usuario. En la línea de abajo escribe: Leer a. Esto pausa el programa y espera que el usuario escriba un número. Repite para la variable b: primero escribe Escribir "Ingrese el segundo número:" y debajo escribe Leer b.; Paso 5: En una nueva línea escribe: resultado = a + b. El signo = asigna el valor de la suma a la variable resultado. No coloques espacios alrededor del signo =.; Paso 6: En la siguiente línea escribe: Escribir "La suma es: ", resultado. La coma dentro de Escribir concatena (une) el texto "La suma es: " con el valor de la variable resultado, mostrándolos juntos en pantalla.; Paso 7: Presiona F9 o haz clic en el botón verde Ejecutar. Cuando aparezca la ventana de entrada, escribe un número (por ejemplo: 5) y presiona Enter. Luego escribe otro número (por ejemplo: 3) y presiona Enter. Debe mostrar: La suma es: 8.; Paso 8: Prueba con otros valores. Vuelve a ejecutar (F9) e ingresa números negativos (-2 y 5) o cero (0 y 7). Verifica que el resultado sea correcto en cada caso.
Par o Impar:Pide un número y determina si es par o impar.
Tabla de Multiplicar:Pide un número y muestra su tabla de multiplicar del 1 al 10.
Contador Regresivo:Pide un número N y muestra los números del N hasta 1.
Mayor de Tres:Pide tres números y muestra cuál es el mayor.
